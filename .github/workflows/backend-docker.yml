name: Build and Push Backend to YCR

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**' # Этот workflow запустится ТОЛЬКО если изменились файлы в папке backend
      - '.github/workflows/backend-docker.yml'

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/teacher-crm-backend:latest
